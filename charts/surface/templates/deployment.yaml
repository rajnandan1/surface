{{- $limit := toString .Values.resources.limits.memory }}
{{- $limitMiB := 0 }}
{{- if hasSuffix "Gi" $limit }}{{ $limitMiB = mul (trimSuffix "Gi" $limit | atoi) 1024 }}
{{- else if hasSuffix "Mi" $limit }}{{ $limitMiB = trimSuffix "Mi" $limit | atoi }}
{{- end }}
{{- if not $limitMiB }}{{ fail "resources.limits.memory must be a whole number of Mi or Gi, such as 4Gi" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: surface
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surface
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 900
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: surface
          image: ghcr.io/rajnandan1/surface:{{ .Chart.AppVersion }}
          args: [serve, --config, /etc/surface/config.yaml]
          env:
            - name: GOMEMLIMIT
              value: {{ div (mul $limitMiB 9) 10 }}MiB
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/surface
              readOnly: true
            - name: results
              mountPath: {{ dig "results" "dir" "/var/lib/surface/results" .Values.config }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
        - name: results
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
