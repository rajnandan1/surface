{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}{{ fail "httpRoute.enabled needs httpRoute.parentRefs" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ (urlParse (required "httpRoute.enabled needs config.url" .Values.config.url)).hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: 80
{{- end }}
